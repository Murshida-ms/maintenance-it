<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบแจ้งงาน - มอบหมายงาน</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #2563EB;
  --primary-light: #EFF6FF;
  --primary-dark: #1D4ED8;
  --sidebar-bg: #0F172A;
  --sidebar-text: #94A3B8;
  --card-bg: #FFFFFF;
  --body-bg: #F1F5F9;
  --text-main: #0F172A;
  --text-muted: #64748B;
  --border: #E2E8F0;
  --pending: #F59E0B;
  --done: #10B981;
  --done-bg: #ECFDF5;
  --rejected: #EF4444;
  --radius: 12px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Sarabun', 'IBM Plex Sans Thai', sans-serif;
  background: var(--body-bg); color: var(--text-main);
  display: flex; min-height: 100vh; font-size: 15px;
}

/* SIDEBAR */
.sidebar { width: 240px; min-height: 100vh; background: var(--sidebar-bg); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; z-index: 100; }
.sidebar-logo { padding: 24px 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.06); }
.sidebar-logo .logo-icon { width: 36px; height: 36px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; margin-bottom: 10px; }
.sidebar-logo h6 { color: #F8FAFC; font-weight: 600; font-size: 14px; margin: 0; }
.sidebar-logo small { color: var(--sidebar-text); font-size: 11px; }
.sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; }
.nav-label { color: #475569; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 12px 8px 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius-sm); color: var(--sidebar-text); text-decoration: none; font-size: 14px; transition: all 0.15s; cursor: pointer; margin-bottom: 2px; }
.nav-item:hover { background: rgba(255,255,255,0.06); color: #F1F5F9; }
.nav-item.active { background: rgba(37,99,235,0.18); color: #60A5FA; }
.nav-item .bi { font-size: 17px; width: 20px; flex-shrink: 0; }
.nav-badge { margin-left: auto; background: var(--primary); color: #fff; font-size: 10px; padding: 1px 7px; border-radius: 99px; font-weight: 600; }
.nav-badge.red { background: var(--rejected); }
.sidebar-user {
    padding: 14px 12px;
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .user-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .user-info { flex: 1; min-width: 0; }
  .sidebar-user .user-name {
    color: #F1F5F9; font-size: 13px; font-weight: 500;
    display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sidebar-user .user-role { color: var(--sidebar-text); font-size: 11px; display: block; }
  .btn-logout-icon {
    width: 30px; height: 30px; border-radius: var(--radius-sm);
    border: 1px solid rgba(255,255,255,0.08); background: transparent;
    color: var(--sidebar-text); display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s; flex-shrink: 0; font-size: 15px;
  }
  .btn-logout-icon:hover { background: rgba(239,68,68,0.15); color: #F87171; border-color: rgba(239,68,68,0.3); }

/* MAIN */
.main { margin-left: 240px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; overflow: hidden; }

/* TOPBAR */
.topbar { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 0 28px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
.topbar-title { font-size: 16px; font-weight: 600; }
.topbar-sub { font-size: 12px; color: var(--text-muted); }
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.icon-btn { width: 36px; height: 36px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); position: relative; transition: background 0.15s; }
.icon-btn:hover { background: var(--body-bg); }
.notif-dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--rejected); border: 1px solid #fff; }
.btn-primary-sm { background: var(--primary); color: #fff; border: none; padding: 7px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 6px; transition: background 0.15s; }
.btn-primary-sm:hover { background: var(--primary-dark); }

/* DISPATCH LAYOUT */
.dispatch-wrap { flex: 1; display: flex; gap: 16px; padding: 20px 28px 28px; overflow: hidden; }
.dispatch-panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; flex: 1; min-width: 0; }
.dispatch-panel-head { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; background: var(--card-bg); flex-wrap: wrap; }
.dispatch-panel-head h2 { font-size: 14px; font-weight: 600; flex: 1; color: var(--text-main); }
.dispatch-panel-body { padding: 14px 16px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 180px); }

/* TICKET CARDS */
.d-ticket-card { background: var(--body-bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
.d-ticket-card:hover { border-color: var(--primary); }
.d-ticket-card.d-selected { border: 1.5px solid var(--primary); background: #EFF6FF; }
.d-ticket-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.d-tid { font-family: 'Courier New', monospace; font-size: 11px; color: var(--primary); background: #EFF6FF; padding: 2px 7px; border-radius: 5px; font-weight: 600; }
.d-pri-badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 5px; }
.d-pri-high { background: #FEE2E2; color: #991B1B; }
.d-pri-med  { background: #FEF9C3; color: #854D0E; }
.d-pri-low  { background: #DCFCE7; color: #166534; }
.d-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; line-height: 1.4; }
.d-meta { display: flex; gap: 10px; font-size: 11px; color: var(--text-muted); flex-wrap: wrap; margin-top: 4px; }
.d-meta span { display: flex; align-items: center; gap: 3px; }

/* ASSIGNED CARD */
.d-assigned-card { background: var(--card-bg); border: 1px solid var(--border); border-left: 3px solid var(--done); border-radius: var(--radius-sm); padding: 10px 14px; display: flex; align-items: flex-start; gap: 10px; }
.d-assigned-icon { width: 28px; height: 28px; border-radius: 50%; background: var(--done-bg); color: var(--done); display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; margin-top: 1px; }
.d-assigned-name { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
.d-assigned-to { font-size: 11px; color: var(--done); font-weight: 600; display: inline-flex; align-items: center; gap: 3px; }

/* DIVIDER & SECTION LABEL */
.d-divider { border: none; border-top: 1px solid var(--border); }
.d-section-lbl { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; padding: 2px 0; display: flex; align-items: center; gap: 5px; }

/* STAFF CARDS */
.d-staff-card { background: var(--body-bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; }
.d-staff-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-color: #94A3B8; }
.d-staff-card.d-staff-selected { border: 1.5px solid var(--primary); background: #EFF6FF; }
.d-staff-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.d-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
.d-av-a { background: #EDE9FE; color: #4C1D95; }
.d-av-b { background: #D1FAE5; color: #064E3B; }
.d-av-c { background: #FEF3C7; color: #78350F; }
.d-av-d { background: #FCE7F3; color: #831843; }
.d-av-e { background: #DBEAFE; color: #1E3A8A; }
.d-staff-name { font-size: 13px; font-weight: 600; }
.d-staff-role { font-size: 11px; color: var(--text-muted); }
.d-staff-right { margin-left: auto; text-align: right; }
.d-wl-num { font-size: 15px; font-weight: 700; }
.d-wl-lbl { font-size: 10px; color: var(--text-muted); }
.d-wl-bar { height: 5px; background: var(--border); border-radius: 99px; overflow: hidden; margin: 4px 0; }
.d-wl-fill { height: 100%; border-radius: 99px; }
.d-wl-low  { background: var(--done); }
.d-wl-med  { background: var(--pending); }
.d-wl-high { background: var(--rejected); }
.d-match-score { display: flex; align-items: center; gap: 6px; font-size: 11px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); }
.d-score-bar { flex: 1; height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
.d-score-fill { height: 100%; border-radius: 99px; background: var(--done); }
.d-score-num { font-size: 11px; font-weight: 700; color: #065F46; min-width: 32px; text-align: right; }

/* SKILL TAGS */
.d-skill-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.d-skill-tag { font-size: 10px; padding: 2px 8px; border-radius: 99px; background: #F1F5F9; border: 1px solid var(--border); color: var(--text-muted); }
.d-skill-tag.matched { background: #D1FAE5; border-color: #6EE7B7; color: #065F46; font-weight: 600; }

/* BADGES */
.d-badge-count { background: var(--rejected); color: #fff; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 99px; }
.d-badge-done  { background: var(--done-bg); color: #065F46; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 99px; display: inline-flex; align-items: center; gap: 3px; }

/* ASSIGN BUTTON */
.d-bottom { padding: 14px 16px; border-top: 1px solid var(--border); }
.d-assign-btn { width: 100%; padding: 10px 16px; border-radius: var(--radius-sm); border: none; background: var(--primary); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; transition: background 0.15s; }
.d-assign-btn:hover:not(:disabled) { background: var(--primary-dark); }
.d-assign-btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

/* SKELETON */
.skeleton { background: linear-gradient(90deg,#E2E8F0 25%,#F1F5F9 50%,#E2E8F0 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 6px; }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.sk-line { height: 12px; margin-bottom: 8px; }

/* EMPTY */
.d-empty { text-align: center; color: var(--text-muted); font-size: 12px; padding: 32px 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.d-empty i { font-size: 32px; }

/* TOAST */
.toast-bar { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(8px); background: #0F172A; color: #fff; padding: 10px 20px; border-radius: 99px; font-size: 13px; font-weight: 500; z-index: 999; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,0.2); opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none; display: flex; align-items: center; gap: 8px; }
.toast-bar.show { opacity: 1; transform: translateX(-50%) translateY(0); }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 99px; }

@media (max-width: 768px) {
  .sidebar { width: 60px; }
  .sidebar-logo h6, .sidebar-logo small, .nav-item span, .nav-badge, .nav-label, .sidebar-user > div { display: none; }
  .main { margin-left: 60px; }
  .dispatch-wrap { flex-direction: column; padding: 16px; overflow-y: auto; }
  .dispatch-panel-body { max-height: 50vh; }
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon"><i class="bi bi-tools"></i></div>
    <h6>ระบบแจ้งงาน</h6>
    <small>Task Management v1.0</small>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-label">หลัก</div>
    <a class="nav-item" onclick="setActive(this);window.location.href='/index'"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></a>
    <a class="nav-item" onclick="setActive(this);window.location.href='/form'"><i class="bi bi-plus-circle-fill"></i><span>แจ้งงาน</span></a>
    <a class="nav-item" onclick="setActive(this);window.location.href='/timeline'"><i class="bi bi-search"></i><span>ติดตามงาน</span></a>
    <a class="nav-item" onclick="setActive(this);window.location.href='/history'"><i class="bi bi-clock-history"></i><span>ประวัติงาน</span></a>
    <div class="nav-label">เจ้าหน้าที่</div>
    <a class="nav-item" onclick="setActive(this);window.location.href='/manage'"><i class="bi bi-kanban"></i><span>จัดการงาน</span><span class="nav-badge red">5</span></a>
    <a class="nav-item active" onclick="setActive(this)"><i class="bi bi-diagram-3"></i><span>มอบหมายงาน</span><span class="nav-badge" id="nav-pending-count">0</span></a>
    <a class="nav-item" onclick="setActive(this)"><i class="bi bi-list-ol"></i><span>คิวงาน</span><span class="nav-badge">12</span></a>
    <a class="nav-item" onclick="setActive(this)"><i class="bi bi-chat-dots"></i><span>แชท</span></a>
    <div class="nav-label">Admin</div>
    <a class="nav-item" onclick="setActive(this)"><i class="bi bi-bar-chart-line"></i><span>รายงาน</span></a>
    <a class="nav-item" onclick="setActive(this)"><i class="bi bi-people"></i><span>ผู้ใช้งาน</span></a>
    <a class="nav-item" onclick="setActive(this)"><i class="bi bi-gear"></i><span>ตั้งค่า</span></a>
  </nav>
  <div class="sidebar-user">
    <div class="user-avatar" id="user-avatar">--</div>
    <div class="user-info">
      <span class="user-name" id="user-fullname">กำลังโหลด...</span>
      <small class="user-role" id="user-role">--</small>
    </div>
    <button class="btn-logout-icon" title="ออกจากระบบ"
      onclick="if(confirm('ออกจากระบบ?')){ window.location.href='/logout'; }">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div>
      <div class="topbar-title">มอบหมายงาน</div>
      <div class="topbar-sub">Smart Task Dispatch</div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" title="แจ้งเตือน"><i class="bi bi-bell" style="font-size:16px"></i><span class="notif-dot"></span></button>
      <button class="btn-primary-sm" onclick="resetDispatch()"><i class="bi bi-arrow-clockwise"></i> รีเซ็ต</button>
    </div>
  </div>
  <div class="dispatch-wrap" id="dispatch-wrap">
    <div class="dispatch-panel">
      <div class="dispatch-panel-head"><h2>กำลังโหลด...</h2></div>
      <div class="dispatch-panel-body">
        <div style="background:var(--body-bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px">
          <div class="skeleton sk-line" style="width:40%"></div>
          <div class="skeleton sk-line" style="width:80%"></div>
          <div class="skeleton sk-line" style="width:60%"></div>
        </div>
        <div style="background:var(--body-bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px">
          <div class="skeleton sk-line" style="width:35%"></div>
          <div class="skeleton sk-line" style="width:75%"></div>
          <div class="skeleton sk-line" style="width:55%"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast-bar" id="toast-bar"></div>

<script>
// ============================================================
//  STAFF DATA (สมมติ)
// ============================================================
const staffList = [
  {
    id: 's1', name: 'ช่างประยงค์ มั่นใจ', role: 'ช่างไฟฟ้า',
    short: 'ปย', avCls: 'd-av-a',
    skills: ['ไฟฟ้า', 'แสงสว่าง', 'UPS', 'ระบบไฟ'],
    active: 2, max: 5
  },
  {
    id: 's2', name: 'ช่างวิชัย สุขใจ', role: 'ช่างระบบเครือข่าย',
    short: 'วช', avCls: 'd-av-b',
    skills: ['เน็ตเวิร์ค', 'WiFi', 'Server', 'IT', 'คอมพิวเตอร์'],
    active: 3, max: 5
  },
  {
    id: 's3', name: 'ช่างสมชาย ดีใจ', role: 'ช่างประปา',
    short: 'สช', avCls: 'd-av-c',
    skills: ['ประปา', 'น้ำรั่ว', 'ท่อ', 'ปั๊มน้ำ', 'ระบบน้ำ'],
    active: 1, max: 5
  }
];

const prioLabel = { high: 'ด่วนมาก', med: 'ปานกลาง', low: 'ปกติ' };
const SLA_HOURS = { high: 4, med: 24, low: 72 };

function calcDeadline(createdAt, priority) {
  if (!createdAt) return null;
  const h = SLA_HOURS[priority] || 24;
  return new Date(new Date(createdAt).getTime() + h * 3600000);
}

function formatDeadline(date) {
  if (!date) return '—';
  const d = date;
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()+543} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} น.`;
}

// ============================================================
//  STATE
// ============================================================
let tasks       = [];
let dSelTicket  = null;
let dSelStaff   = null;
let assignedMap = {};

// ============================================================
//  LOAD TICKETS FROM API
// ============================================================
async function loadTickets() {
  try {
    const res = await fetch('/api/tickets');
    if (!res.ok) throw new Error();
    const data = await res.json();

    tasks = data
      .filter(t => t.status === 'pending' || t.status === 'inprogress')
      .map(t => ({
        id:          'TK-' + String(t.id).padStart(4, '0'),
        _id:         t.id,
        title:       t.title,
        detail:      t.detail || '',
        pri:         t.priority || 'low',
        status:      t.status,
        note:        t.note || '',
        time:        formatTime(t.created_at),
        createdDate: formatDate(t.created_at),
        reporter:    t.reporter || t.reported_by || t.created_by || '—',
        assignee:    t.assignee || '—',
        needs:       [],
        deadlineDate: calcDeadline(t.created_at, t.priority),
        get deadlineStr() { return formatDeadline(this.deadlineDate); },
        get secsLeft() {
          if (!this.deadlineDate) return null;
          return Math.floor((this.deadlineDate.getTime() - Date.now()) / 1000);
        },
      }));

    renderDispatch();
  } catch {
    document.getElementById('dispatch-wrap').innerHTML = `
      <div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:13px;gap:8px">
        <i class="bi bi-exclamation-circle" style="font-size:20px"></i>
        ไม่สามารถโหลดข้อมูลได้ กรุณารีเฟรชหน้า
      </div>`;
  }
}

function formatTime(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function formatDate(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr);
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()+543}`;
}

// ============================================================
//  HELPERS
// ============================================================
function setActive(el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
}

function showToast(msg, icon = 'bi-check-circle-fill', color = '#10B981') {
  const el = document.getElementById('toast-bar');
  el.innerHTML = `<i class="bi ${icon}" style="color:${color}"></i>${msg}`;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2400);
}

function wlCls(pct)   { return pct >= 90 ? 'd-wl-high' : pct >= 60 ? 'd-wl-med' : 'd-wl-low'; }
function wlColor(pct) { return pct >= 90 ? 'var(--rejected)' : pct >= 60 ? 'var(--pending)' : 'var(--done)'; }
function nowStr() {
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ' น.';
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ============================================================
//  SCORING — คำนวณความเหมาะสมของช่างกับงาน
// ============================================================
function scoreStaff(ticket, s) {
  const needs = ticket.needs || [];
  const matched = needs.length
    ? s.skills.filter(sk => needs.some(n => n === sk || sk.includes(n) || n.includes(sk)))
    : [];
  const skillScore = needs.length > 0 ? (matched.length / needs.length) * 60 : 30;
  const wlScore    = (1 - (s.active / s.max)) * 40;
  return { total: Math.round(skillScore + wlScore), matched };
}

// ============================================================
//  RENDER
// ============================================================
function renderDispatch() {
  const wrap = document.getElementById('dispatch-wrap');

  const pendingTasks  = tasks.filter(t => !assignedMap[t.id]);
  const assignedTasks = tasks.filter(t =>  assignedMap[t.id]);

  const navCount = document.getElementById('nav-pending-count');
  if (navCount) navCount.textContent = pendingTasks.length;

  const scoredStaff = dSelTicket
    ? staffList.map(s => ({ ...s, ...scoreStaff(dSelTicket, s) })).sort((a, b) => b.total - a.total)
    : staffList.map(s => {
        const wlPct = Math.round((s.active / s.max) * 100);
        return { ...s, total: Math.round((1 - s.active / s.max) * 100), matched: [] };
      }).sort((a, b) => b.total - a.total);

  wrap.innerHTML = `
    <!-- LEFT: รายการงาน -->
    <div class="dispatch-panel">
      <div class="dispatch-panel-head">
        <i class="bi bi-inbox" style="font-size:16px;color:var(--text-muted)"></i>
        <h2>งานที่รอมอบหมาย</h2>
        ${pendingTasks.length  ? `<span class="d-badge-count">${pendingTasks.length}</span>` : ''}
        ${assignedTasks.length ? `<span class="d-badge-done"><i class="bi bi-check-circle-fill"></i>${assignedTasks.length}</span>` : ''}
      </div>
      <div class="dispatch-panel-body">

        ${pendingTasks.length === 0 && assignedTasks.length === 0
          ? `<div class="d-empty"><i class="bi bi-inbox"></i><span>ไม่มีงานที่รอมอบหมาย</span></div>`
          : ''}

        ${pendingTasks.map(t => {
          const isSel = dSelTicket && dSelTicket.id === t.id;
          const secs = t.secsLeft;
          const isOver   = secs !== null && secs < 0;
          const isUrgent = secs !== null && secs >= 0 && secs < 3600;
          const dlColor  = isOver ? '#991B1B' : isUrgent ? '#92400E' : '#065F46';
          const dlBg     = isOver ? '#FEE2E2' : isUrgent ? '#FEF9C3' : '#DCFCE7';
          const dlIcon   = isOver ? 'bi-exclamation-triangle-fill' : 'bi-alarm';
          return `
          <div class="d-ticket-card${isSel ? ' d-selected' : ''}" onclick="dSelectTicket('${t.id}')">
            <div class="d-ticket-top">
              <span class="d-tid">${escHtml(t.id)}</span>
              <span class="d-pri-badge d-pri-${t.pri}">${prioLabel[t.pri] || t.pri}</span>
            </div>
            <div class="d-title">${escHtml(t.title)}</div>
            ${t.detail ? `<div style="font-size:12px;color:var(--text-muted);margin-bottom:7px;line-height:1.5">${escHtml(t.detail)}</div>` : ''}
            <div style="display:flex;flex-direction:column;gap:4px;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)">
              <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px">
                <span style="font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:4px">
                  <i class="bi bi-person-fill" style="font-size:10px;color:var(--primary)"></i>
                  <span style="font-weight:600;color:var(--text-main)">${t.reporter && t.reporter !== '—' ? escHtml(t.reporter) : '—'}</span>
                </span>
                <span style="font-size:10px;color:var(--text-muted);display:flex;align-items:center;gap:3px">
                  <i class="bi bi-clock" style="font-size:10px"></i>${t.createdDate} ${t.time} น.
                </span>
              </div>
              <div style="display:flex;align-items:center;gap:5px;font-size:11px;background:${dlBg};color:${dlColor};padding:4px 8px;border-radius:6px;width:fit-content;font-weight:600">
                <i class="bi ${dlIcon}" style="font-size:11px"></i>
                กำหนดส่ง: ${t.deadlineStr}
              </div>
            </div>
          </div>`;
        }).join('')}

        ${assignedTasks.length ? `
          <hr class="d-divider">
          ${pendingTasks.length === 0 ? `
            <div class="d-empty" style="padding:16px">
              <i class="bi bi-check-circle-fill" style="font-size:28px;color:var(--done)"></i>
              <span>มอบหมายงานครบทุกรายการแล้ว</span>
            </div>` : ''}
          <div class="d-section-lbl">
            <i class="bi bi-check-circle-fill" style="color:var(--done)"></i>
            มอบหมายแล้ว (${assignedTasks.length})
          </div>
          ${assignedTasks.map(t => {
            const a = assignedMap[t.id];
            return `
            <div class="d-assigned-card">
              <div class="d-assigned-icon"><i class="bi bi-check-lg"></i></div>
              <div style="flex:1;min-width:0">
                <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap">
                  <span class="d-tid">${escHtml(t.id)}</span>
                  <span class="d-pri-badge d-pri-${t.pri}">${prioLabel[t.pri] || t.pri}</span>
                </div>
                <div class="d-assigned-name">${escHtml(t.title)}</div>
                <div class="d-meta" style="margin-top:4px">
                  <span><i class="bi bi-clock" style="font-size:10px"></i>${t.createdDate}</span>
                  ${t.reporter && t.reporter !== '—'
                    ? `<span><i class="bi bi-person" style="font-size:10px"></i>ผู้แจ้ง: ${escHtml(t.reporter)}</span>`
                    : ''}
                </div>
                <div style="display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap">
                  <span class="d-assigned-to">
                    <i class="bi bi-person-check-fill"></i>${escHtml(a.staffName)}
                  </span>
                  <span style="font-size:11px;color:var(--text-muted)">${a.at}</span>
                </div>
              </div>
            </div>`;
          }).join('')}
        ` : ''}

      </div>
    </div>

    <!-- RIGHT: เจ้าหน้าที่ -->
    <div class="dispatch-panel">
      <div class="dispatch-panel-head">
        <i class="bi bi-people" style="font-size:16px;color:var(--text-muted)"></i>
        <h2>${dSelTicket ? 'เลือกผู้รับผิดชอบ' : 'เจ้าหน้าที่ทั้งหมด'}</h2>
        <span style="font-size:11px;color:var(--text-muted)">${staffList.length} คน</span>
      </div>
      <div class="dispatch-panel-body">

        ${dSelTicket ? `
          <!-- งานที่เลือก -->
          <div style="background:var(--primary-light);border:1px solid #BFDBFE;border-radius:var(--radius-sm);padding:10px 12px;font-size:12px">
            <div style="font-weight:600;color:var(--primary);margin-bottom:4px;display:flex;align-items:center;gap:6px">
              <i class="bi bi-cursor-fill"></i> งานที่เลือก
            </div>
            <div style="font-weight:600;font-size:13px;color:var(--text-main)">${escHtml(dSelTicket.title)}</div>
            <div class="d-meta" style="margin-top:4px">
              <span>${escHtml(dSelTicket.id)}</span>
              <span><i class="bi bi-clock" style="font-size:10px"></i>${dSelTicket.createdDate}</span>
              ${dSelTicket.reporter && dSelTicket.reporter !== '—'
                ? `<span><i class="bi bi-person" style="font-size:10px"></i>ผู้แจ้ง: ${escHtml(dSelTicket.reporter)}</span>`
                : ''}
            </div>
          </div>
          <div class="d-section-lbl" style="margin-top:4px">
            <i class="bi bi-sort-down"></i> เลือกผู้รับผิดชอบ
          </div>
        ` : `
          <div style="background:#F8FAFC;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:8px">
            <i class="bi bi-info-circle"></i>
            เลือกงาน
          </div>
        `}

        ${scoredStaff.map(s => {
          const isSel = dSelStaff && dSelStaff.id === s.id;
          const wlPct = Math.round((s.active / s.max) * 100);
          const isAvail = s.active < s.max;
          return `
          <div class="d-staff-card${isSel ? ' d-staff-selected' : ''}${!isAvail ? ' opacity-full' : ''}"
               onclick="${isAvail ? `dSelectStaff('${s.id}')` : 'void(0)'}">
            <div class="d-staff-top">
              <div class="d-avatar ${s.avCls}">${s.short}</div>
              <div>
                <div class="d-staff-name">${escHtml(s.name)}</div>
                <div class="d-staff-role">${escHtml(s.role)}</div>
              </div>
              <div class="d-staff-right">
                <div class="d-wl-num" style="color:${wlColor(wlPct)}">${s.active}/${s.max}</div>
                <div class="d-wl-lbl">งานในมือ</div>
                ${!isAvail ? `<div style="font-size:10px;color:var(--rejected);font-weight:600">เต็ม</div>` : ''}
              </div>
            </div>
            <div class="d-wl-bar">
              <div class="d-wl-fill ${wlCls(wlPct)}" style="width:${wlPct}%"></div>
            </div>
            <!-- ทักษะ -->
            <div class="d-skill-tags">
              ${s.skills.map(sk => {
                const isMatch = s.matched && s.matched.includes(sk);
                return `<span class="d-skill-tag${isMatch ? ' matched' : ''}">${escHtml(sk)}</span>`;
              }).join('')}
            </div>
            <!-- คะแนนความเหมาะสม -->
            ${dSelTicket ? `
            <div class="d-match-score">
              <span style="color:var(--text-muted)">ความเหมาะสม</span>
              <div class="d-score-bar">
                <div class="d-score-fill" style="width:${s.total}%;background:${s.total >= 70 ? 'var(--done)' : s.total >= 40 ? 'var(--pending)' : '#CBD5E1'}"></div>
              </div>
              <span class="d-score-num" style="color:${s.total >= 70 ? '#065F46' : s.total >= 40 ? '#92400E' : 'var(--text-muted)'}">${s.total}%</span>
            </div>` : ''}
          </div>`;
        }).join('')}

      </div>
      <div class="d-bottom">
        <button class="d-assign-btn" ${!dSelTicket || !dSelStaff ? 'disabled' : ''} onclick="doDispatchAssign()">
          <i class="bi bi-send"></i>
          ${dSelTicket && dSelStaff
            ? `มอบหมาย ${escHtml(dSelTicket.id)} → ${escHtml(dSelStaff.name)}`
            : 'เลือกงาน และผู้รับผิดชอบ'}
        </button>
      </div>
    </div>`;
}

// ============================================================
//  ACTIONS
// ============================================================
function dSelectTicket(id) {
  dSelTicket = tasks.find(t => t.id === id) || null;
  dSelStaff  = null;
  renderDispatch();
}

function dSelectStaff(id) {
  const s = staffList.find(x => x.id === id);
  if (!s || s.active >= s.max) return;
  dSelStaff = s;
  renderDispatch();
}

async function doDispatchAssign() {
  if (!dSelTicket || !dSelStaff) return;

  const tid   = dSelTicket.id;
  const sname = dSelStaff.name;

  try {
    await fetch(`/api/tickets/${dSelTicket._id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        title:    dSelTicket.title,
        detail:   dSelTicket.detail,
        note:     dSelTicket.note,
        priority: dSelTicket.pri,
        assignee: sname,
      }),
    });
  } catch { /* ถ้า API ล้มเหลว ยัง assign ใน UI ได้ */ }

  assignedMap[tid] = { staffId: dSelStaff.id, staffName: sname, at: nowStr() };
  dSelStaff.active = Math.min(dSelStaff.active + 1, dSelStaff.max);

  dSelTicket = null;
  dSelStaff  = null;

  renderDispatch();
  showToast(`มอบหมาย ${tid} ให้ ${sname} แล้ว`, 'bi-check-circle-fill', '#10B981');
}

function resetDispatch() {
  Object.values(assignedMap).forEach(a => {
    const s = staffList.find(x => x.id === a.staffId);
    if (s) s.active = Math.max(s.active - 1, 0);
  });
  dSelTicket  = null;
  dSelStaff   = null;
  assignedMap = {};
  renderDispatch();
  showToast('รีเซ็ตการมอบหมายแล้ว', 'bi-arrow-clockwise', '#64748B');
}

// ============================================================
//  INIT
// ============================================================
async function loadUser() {
  try {
    const res = await fetch('/api/me');
    if (res.status === 401) { window.location.href = '/login'; return; }
    const data = await res.json();
    document.getElementById('user-fullname').textContent = data.fullName;
    document.getElementById('user-role').textContent     = data.role;
    document.getElementById('user-avatar').textContent   = data.fullName.substring(0, 2);
  } catch(e) { console.error(e); }
}

loadUser();
loadTickets();
</script>
</body>
</html>
