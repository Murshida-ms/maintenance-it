<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบแจ้งงาน - มอบหมายงาน</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/queue.css">
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon"><i class="bi bi-tools"></i></div>
    <h6>ระบบแจ้งงาน</h6>
    <small>Task Management v2.0</small>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-label">หลัก</div>
    <a class="nav-item" onclick="setActive(this);window.location.href='/index'"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></a>
    <a class="nav-item" onclick="setActive(this);window.location.href='/form'"><i class="bi bi-plus-circle-fill"></i><span>แจ้งงาน</span></a>
    <a class="nav-item" onclick="setActive(this);window.location.href='/timeline'"><i class="bi bi-search"></i><span>ติดตามงาน</span></a>
    <a class="nav-item" onclick="setActive(this);window.location.href='/history'"><i class="bi bi-clock-history"></i><span>ประวัติงาน</span></a>
    <div class="nav-label">เจ้าหน้าที่</div>
    <a class="nav-item" onclick="setActive(this);window.location.href='/manage'"><i class="bi bi-kanban"></i><span>จัดการงาน</span></a>
    <a class="nav-item active" onclick="setActive(this)"><i class="bi bi-diagram-3"></i><span>มอบหมายงาน</span><span class="nav-badge red" id="nav-pending-count">0</span></a>
    <div class="nav-label">Admin</div>
    <a class="nav-item" onclick="setActive(this)"><i class="bi bi-bar-chart-line"></i><span>รายงาน</span></a>
    <a class="nav-item" onclick="setActive(this)"><i class="bi bi-people"></i><span>ผู้ใช้งาน</span></a>
    <a class="nav-item" onclick="setActive(this)"><i class="bi bi-gear"></i><span>ตั้งค่า</span></a>
  </nav>
  <div class="sidebar-user">
    <div class="user-avatar" id="user-avatar">--</div>
    <div class="user-info">
      <span class="user-name" id="user-fullname">กำลังโหลด...</span>
      <small class="user-role" id="user-role">--</small>
    </div>
    <button class="btn-logout-icon" title="ออกจากระบบ"
      onclick="if(confirm('ออกจากระบบ?')){ window.location.href='/logout'; }">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div>
      <div class="topbar-title">มอบหมายงาน</div>
      <div class="topbar-sub">Smart Task Dispatch</div>
    </div>
    <div class="topbar-actions">
      <div class="notif-wrap" id="notif-wrap">
        <button class="icon-btn" title="แจ้งเตือน" onclick="toggleNotif(event)" style="position:relative">
          <i class="bi bi-bell" style="font-size:16px"></i>
          <span class="notif-badge" id="notif-badge" style="display:none">0</span>
        </button>
        <div class="notif-dropdown" id="notif-dropdown">
          <div class="notif-head">
            <span class="notif-head-title">การแจ้งเตือน</span>
            <button class="notif-mark-all" onclick="markAllRead()">อ่านทั้งหมด</button>
          </div>
          <div class="notif-list" id="notif-list">
            <div class="notif-empty"><i class="bi bi-bell-slash"></i>ไม่มีการแจ้งเตือน</div>
          </div>
        </div>
      </div>
      <button class="btn-primary-sm" onclick="resetDispatch()"><i class="bi bi-arrow-clockwise"></i> รีเซ็ต</button>
    </div>
  </div>
  <div class="dispatch-wrap" id="dispatch-wrap">
    <div class="dispatch-panel">
      <div class="dispatch-panel-head"><h2>กำลังโหลด...</h2></div>
      <div class="dispatch-panel-body">
        <div style="background:var(--body-bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px">
          <div class="skeleton sk-line" style="width:40%"></div>
          <div class="skeleton sk-line" style="width:80%"></div>
          <div class="skeleton sk-line" style="width:60%"></div>
        </div>
        <div style="background:var(--body-bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px">
          <div class="skeleton sk-line" style="width:35%"></div>
          <div class="skeleton sk-line" style="width:75%"></div>
          <div class="skeleton sk-line" style="width:55%"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast-bar" id="toast-bar"></div>

<script src="/js/queue.js"></script>
</body>
</html>
